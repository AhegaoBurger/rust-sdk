[package]
name = "rmcp-types"
license = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
readme = { workspace = true }
description = "Type definitions for the Model Context Protocol"
documentation = "https://docs.rs/rmcp-types"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = { version = "1.0", optional = true, features = ["chrono04"] }
chrono = { version = "0.4.38", features = ["serde"] }
base64 = { version = "0.22", optional = true }
paste = { version = "1", optional = true }
rmcp-macros-core = { path = "../rmcp-macros-core", version = "0.6.4", features = ["paste"] }

[features]
default = ["base64"]
schemars = ["dep:schemars"]
paste = ["dep:paste"]
elicitation = []
